openapi: 3.0.0
info:
  title: Next.js Social Login API
  description: API for handling social login authentication flows
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Development server

paths:
  /api/auth/google:
    get:
      summary: Initiate Google OAuth flow
      description: Redirects user to Google OAuth consent screen
      responses:
        '302':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth URL with state parameter
              schema:
                type: string
                format: uri

  /api/auth/facebook:
    get:
      summary: Initiate Facebook OAuth flow
      description: Redirects user to Facebook OAuth consent screen
      responses:
        '302':
          description: Redirect to Facebook OAuth consent screen
          headers:
            Location:
              description: Facebook OAuth URL with state parameter
              schema:
                type: string
                format: uri

  /api/auth/callback:
    get:
      summary: Handle OAuth callback
      description: Receives OAuth callback from providers and returns JWT token
      parameters:
        - name: code
          in: query
          description: Authorization code from OAuth provider
          required: false
          schema:
            type: string
        - name: state
          in: query
          description: State parameter for CSRF protection
          required: false
          schema:
            type: string
        - name: error
          in: query
          description: Error code from OAuth provider
          required: false
          schema:
            type: string
        - name: error_description
          in: query
          description: Error description from OAuth provider
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend callback page with token or error
          headers:
            Location:
              description: Frontend callback URL with token or error parameters
              schema:
                type: string
                format: uri
        '400':
          description: Bad request due to missing or invalid parameters

  /api/auth/me:
    get:
      summary: Get current user info
      description: Retrieve information about the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserInfo'
        '401':
          description: Unauthorized - invalid or expired token
        '403':
          description: Forbidden - insufficient permissions

  /api/auth/logout:
    post:
      summary: Logout user
      description: Invalidate user session and clear authentication
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          description: Unauthorized - invalid or expired token

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserInfo:
      type: object
      required:
        - id
        - email
        - name
        - provider
      properties:
        id:
          type: string
          description: Unique user identifier
        email:
          type: string
          format: email
          description: User's email address
        name:
          type: string
          description: User's full name
        provider:
          type: string
          enum: [google, facebook]
          description: OAuth provider used for authentication
        picture:
          type: string
          format: uri
          description: URL to user's profile picture (optional)