openapi: 3.0.0
info:
  title: Social Login API
  version: 1.0.0
  description: API for OAuth 2.0 social login functionality

paths:
  /auth/google:
    get:
      summary: Initiate Google OAuth flow
      description: Redirects user to Google's OAuth consent screen
      responses:
        '302':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              schema:
                type: string
              description: Google OAuth URL with client_id and state

  /auth/google/callback:
    get:
      summary: Google OAuth callback handler
      description: Handles the callback from Google OAuth and authenticates user
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter for CSRF protection
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend with JWT token
          headers:
            Location:
              schema:
                type: string
              description: Frontend URL with JWT token
        '400':
          description: Bad request - invalid code or state
        '401':
          description: Unauthorized - failed authentication

  /auth/facebook:
    get:
      summary: Initiate Facebook OAuth flow
      description: Redirects user to Facebook's OAuth consent screen
      responses:
        '302':
          description: Redirect to Facebook OAuth consent screen
          headers:
            Location:
              schema:
                type: string
              description: Facebook OAuth URL with client_id and state

  /auth/facebook/callback:
    get:
      summary: Facebook OAuth callback handler
      description: Handles the callback from Facebook OAuth and authenticates user
      parameters:
        - name: code
          in: query
          required: true
          description: Authorization code from Facebook
          schema:
            type: string
        - name: state
          in: query
          required: true
          description: State parameter for CSRF protection
          schema:
            type: string
      responses:
        '302':
          description: Redirect to frontend with JWT token
          headers:
            Location:
              schema:
                type: string
              description: Frontend URL with JWT token
        '400':
          description: Bad request - invalid code or state
        '401':
          description: Unauthorized - failed authentication

  /health:
    get:
      summary: Health check endpoint
      description: Returns the health status of the API
      responses:
        '200':
          description: Health status response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"

  /privacy:
    get:
      summary: Privacy policy endpoint
      description: Returns the privacy policy information
      responses:
        '200':
          description: Privacy policy response
          content:
            application/json:
              schema:
                type: object
                properties:
                  privacy:
                    type: string
                    example: "This app uses Google and Facebook login for authentication only. No personal data is stored or shared."

components:
  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token for authenticated session
        user:
          type: object
          properties:
            id:
              type: string
              description: User ID
            email:
              type: string
              description: User email
            name:
              type: string
              description: User name
            provider:
              type: string
              description: OAuth provider (google, facebook)
          required:
            - id
            - email
            - name
            - provider
      required:
        - token
        - user